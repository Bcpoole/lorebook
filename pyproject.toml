[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorebook"
version = "0.1.0"
description = "Lore and companion character generation workflow built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.6",
    "requests>=2.34.2",
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.49.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=3.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "httpx2>=2.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
